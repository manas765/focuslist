<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusList — a clear-headed task ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F4EE;
    --paper-raised: #FFFFFF;
    --ink: #21242B;
    --ink-soft: #5C606A;
    --ink-faint: #9A968C;
    --line: #E4DECE;
    --line-strong: #CFC6AF;
    --focus: #3E5C76;
    --focus-deep: #2C4459;
    --focus-tint: #E9EEF3;
    --high: #C1483B;
    --high-tint: #F8E9E6;
    --medium: #B8791F;
    --medium-tint: #F7EEDC;
    --low: #4E7A5B;
    --low-tint: #E8F0EA;
    --done: #A6A296;
    --danger: #B23A2E;
    --danger-tint: #FBEAE8;
    --shadow-sm: 0 1px 2px rgba(33,36,43,0.04), 0 1px 1px rgba(33,36,43,0.03);
    --shadow-md: 0 4px 14px rgba(33,36,43,0.07), 0 1px 3px rgba(33,36,43,0.05);
    --shadow-lg: 0 14px 34px rgba(33,36,43,0.12), 0 3px 8px rgba(33,36,43,0.06);
    --radius: 10px;
    --radius-sm: 6px;
    --serif: "Lora", Georgia, serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(62,92,118,0.06), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(184,121,31,0.05), transparent 40%);
    background-attachment: fixed;
  }
  ::selection { background: var(--focus-tint); color: var(--focus-deep); }
  a, button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Layout shell ---------- */
  .shell {
    flex: 1;
    display: grid;
    grid-template-columns: 288px 1fr;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 44px 28px 64px;
    gap: 40px;
  }
  @media (max-width: 860px) {
    .shell {
      grid-template-columns: 1fr;
      padding: 20px 14px 44px;
      gap: 18px;
    }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: sticky;
    top: 24px;
    align-self: start;
  }
  @media (max-width: 860px) { .sidebar { position: static; } }

  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand .mark {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.85rem;
    letter-spacing: -0.015em;
    line-height: 1.05;
  }
  .brand .mark .dot { color: var(--focus); }
  .brand .today {
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-style: italic;
    font-family: var(--serif);
  }
  .brand .tag {
    font-size: 0.85rem;
    color: var(--ink-soft);
    max-width: 30ch;
    line-height: 1.5;
    margin-top: 2px;
  }

  .stats {
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .stat-cell {
    padding: 12px 8px 10px;
    border-radius: var(--radius-sm);
    text-align: center;
    transition: background 0.15s ease;
  }
  .stat-value {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    display: block;
  }
  .stat-label {
    font-size: 0.68rem;
    color: var(--ink-faint);
    margin-top: 5px;
    display: block;
  }
  .stat-cell.pending .stat-value { color: var(--focus-deep); }
  .stat-cell.completed .stat-value { color: var(--low); }
  .stats-progress {
    grid-column: 1 / -1;
    padding: 4px 10px 8px;
  }
  .progress-track {
    height: 5px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--focus), var(--low));
    width: 0%;
    transition: width 0.4s ease;
  }

  nav.filters {
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .filter-group h3 {
    margin: 0 0 9px;
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .filter-list { display: flex; flex-direction: column; gap: 2px; }
  .filter-btn {
    all: unset;
    padding: 7px 10px;
    font-size: 0.9rem;
    color: var(--ink-soft);
    border-radius: var(--radius-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .filter-btn:hover { background: var(--paper); color: var(--ink); }
  .filter-btn.active { color: #fff; font-weight: 600; background: var(--focus); }
  .filter-btn .count {
    font-variant-numeric: tabular-nums;
    color: inherit;
    opacity: 0.65;
    font-weight: 400;
    font-size: 0.82rem;
  }

  .priority-filters { display: flex; flex-wrap: wrap; gap: 7px; }
  .flag-chip {
    all: unset;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px 6px 9px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    transition: all 0.12s ease;
  }
  .flag-chip:hover { border-color: var(--line-strong); }
  .flag-chip .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .flag-chip[data-p="high"] .swatch { background: var(--high); }
  .flag-chip[data-p="medium"] .swatch { background: var(--medium); }
  .flag-chip[data-p="low"] .swatch { background: var(--low); }
  .flag-chip.active { font-weight: 600; color: var(--ink); border-color: transparent; }
  .flag-chip[data-p="high"].active { background: var(--high-tint); color: var(--high); }
  .flag-chip[data-p="medium"].active { background: var(--medium-tint); color: var(--medium); }
  .flag-chip[data-p="low"].active { background: var(--low-tint); color: var(--low); }
  .flag-chip[data-p="all"].active { background: var(--focus-tint); color: var(--focus-deep); }

  .clear-btn {
    all: unset;
    font-size: 0.8rem;
    color: var(--ink-faint);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    align-self: flex-start;
  }
  .clear-btn:hover { color: var(--danger); }

  /* ---------- Main column ---------- */
  main { display: flex; flex-direction: column; min-width: 0; }

  .composer {
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .composer-row { display: flex; gap: 10px; width: 100%; }
  .composer input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-size: 0.95rem;
    color: var(--ink);
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .composer input[type="text"]:focus-visible {
    outline: none;
    border-color: var(--focus);
    background: var(--paper-raised);
  }
  .composer-options { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }

  .priority-select {
    display: flex;
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex-shrink: 0;
    border: 1.5px solid var(--line);
  }
  .priority-select button {
    all: unset;
    padding: 9px 14px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
    transition: background 0.12s ease;
  }
  .priority-select button:last-child { border-right: none; }
  .priority-select button .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.55; }
  .priority-select button[data-p="high"] { color: var(--high); }
  .priority-select button[data-p="medium"] { color: var(--medium); }
  .priority-select button[data-p="low"] { color: var(--low); }
  .priority-select button.sel[data-p="high"] { background: var(--high-tint); font-weight: 600; }
  .priority-select button.sel[data-p="medium"] { background: var(--medium-tint); font-weight: 600; }
  .priority-select button.sel[data-p="low"] { background: var(--low-tint); font-weight: 600; }
  .priority-select button.sel .dot { opacity: 1; }

  .due-field {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    color: var(--ink-soft);
    flex: 1;
    min-width: 180px;
  }
  .due-field svg { flex-shrink: 0; opacity: 0.65; }
  .due-field input[type="datetime-local"] {
    border: none;
    background: transparent;
    padding: 9px 0;
    font-size: 0.85rem;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .due-field input[type="datetime-local"]:focus-visible { outline: none; }
  .due-clear {
    all: unset;
    color: var(--ink-faint);
    font-size: 0.75rem;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .due-clear:hover { color: var(--danger); background: var(--danger-tint); }

  .add-btn {
    all: unset;
    background: var(--focus);
    color: #fff;
    padding: 0 22px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.08s ease;
    box-shadow: var(--shadow-sm);
  }
  .add-btn:hover { background: var(--focus-deep); }
  .add-btn:active { transform: translateY(1px); }

  @media (max-width: 560px) {
    .composer-row { flex-wrap: wrap; }
    .add-btn { width: 100%; padding: 12px 0; order: 3; }
    .composer input[type="text"] { order: 1; width: 100%; }
    .composer-options { order: 2; }
    .due-field { width: 100%; }
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint); pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1.5px solid var(--line);
    border-radius: 20px;
    background: var(--paper-raised);
    font-size: 0.88rem;
    color: var(--ink);
    transition: border-color 0.12s ease;
  }
  .search-wrap input:focus-visible { outline: none; border-color: var(--focus); }
  .mobile-filter-toggle {
    display: none;
    all: unset;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--focus-deep);
    background: var(--focus-tint);
    padding: 9px 14px;
    border-radius: 20px;
  }
  @media (max-width: 860px) { .mobile-filter-toggle { display: inline-flex; } }

  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 4px 10px;
  }
  .list-head h2 { margin: 0; font-family: var(--serif); font-size: 1.1rem; font-weight: 600; }
  .list-head .meta { font-size: 0.8rem; color: var(--ink-faint); }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task {
    display: grid;
    grid-template-columns: 4px 24px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    background: var(--paper-raised);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
    animation: rise 0.22s ease both;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .task:hover { box-shadow: var(--shadow-md); }
  .task.completed { background: #FCFBF8; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flagbar { align-self: stretch; border-radius: 3px; }
  .flagbar[data-p="high"] { background: var(--high); }
  .flagbar[data-p="medium"] { background: var(--medium); }
  .flagbar[data-p="low"] { background: var(--low); }
  .task.completed .flagbar { opacity: 0.35; }

  .check {
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--paper-raised);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .check:hover { border-color: var(--focus); transform: scale(1.06); }
  .check.done { background: var(--low); border-color: var(--low); }
  .check svg { opacity: 0; transform: scale(0.6); transition: opacity 0.12s ease, transform 0.12s ease; }
  .check.done svg { opacity: 1; transform: scale(1); }

  .task-body { min-width: 0; }
  .task-title { font-size: 0.96rem; line-height: 1.35; word-break: break-word; color: var(--ink); }
  .task.completed .task-title { color: var(--done); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .task-sub {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 4px;
    font-size: 0.74rem;
    color: var(--ink-faint);
  }
  .prio-label { font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .prio-label[data-p="high"] { color: var(--high); }
  .prio-label[data-p="medium"] { color: var(--medium); }
  .prio-label[data-p="low"] { color: var(--low); }

  .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .due-badge.overdue { background: var(--danger-tint); color: var(--danger); font-weight: 600; }
  .due-badge svg { flex-shrink: 0; }

  .edit-panel { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .edit-input {
    width: 100%;
    padding: 7px 9px;
    border: 1.5px solid var(--focus);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    background: var(--focus-tint);
  }
  .edit-due {
    display: flex; align-items: center; gap: 6px;
  }
  .edit-due input[type="datetime-local"] {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 0.78rem;
    background: var(--paper-raised);
  }
  .edit-due button {
    all: unset; font-size: 0.72rem; color: var(--ink-faint); cursor: pointer;
  }
  .edit-due button:hover { color: var(--danger); }

  .task-actions { display: flex; gap: 3px; }
  .icon-btn {
    all: unset;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--ink-faint);
    transition: background 0.12s ease, color 0.12s ease;
  }
  .icon-btn:hover { background: var(--focus-tint); color: var(--focus-deep); }
  .icon-btn.delete:hover { background: var(--danger-tint); color: var(--danger); }
  .icon-btn.save { color: var(--focus); }

  .empty-state {
    padding: 64px 24px;
    text-align: center;
    color: var(--ink-faint);
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .empty-state .glyph { font-family: var(--serif); font-size: 1.7rem; color: var(--ink-soft); margin-bottom: 6px; }
  .empty-state p { margin: 4px 0 0; font-size: 0.88rem; max-width: 34ch; margin-inline: auto; }

  footer { text-align: center; font-size: 0.75rem; color: var(--ink-faint); padding: 22px 0 8px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 860px) {
    .sidebar.collapsed .filters, .sidebar.collapsed .stats { display: none; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">Focus<span class="dot">·</span>List</div>
      <div class="today" id="today-label"></div>
      <div class="tag">One page for what needs doing today. Nothing else on it.</div>
    </div>

    <div class="stats" role="status" aria-label="Task statistics">
      <div class="stat-cell">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-cell pending">
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-cell completed">
        <span class="stat-value" id="stat-completed">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stats-progress"><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
    </div>

    <nav class="filters">
      <div class="filter-group">
        <h3>Status</h3>
        <div class="filter-list" id="status-filters">
          <button class="filter-btn active" data-status="all">All <span class="count" id="count-all">0</span></button>
          <button class="filter-btn" data-status="active">Active <span class="count" id="count-active">0</span></button>
          <button class="filter-btn" data-status="completed">Completed <span class="count" id="count-completed">0</span></button>
        </div>
      </div>
      <div class="filter-group">
        <h3>Priority</h3>
        <div class="priority-filters" id="priority-filters">
          <button class="flag-chip active" data-p="all">All</button>
          <button class="flag-chip" data-p="high"><span class="swatch"></span>High</button>
          <button class="flag-chip" data-p="medium"><span class="swatch"></span>Medium</button>
          <button class="flag-chip" data-p="low"><span class="swatch"></span>Low</button>
        </div>
      </div>
      <button class="clear-btn" id="clear-completed">Clear completed tasks</button>
    </nav>
  </aside>

  <main>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-row">
        <label for="new-task" class="sr-only">New task title</label>
        <input type="text" id="new-task" placeholder="What needs doing?" maxlength="140" />
        <button type="submit" class="add-btn">Add task</button>
      </div>
      <div class="composer-options">
        <div class="priority-select" id="new-priority" role="group" aria-label="Priority for new task">
          <button type="button" data-p="low"><span class="dot"></span>Low</button>
          <button type="button" data-p="medium" class="sel"><span class="dot"></span>Medium</button>
          <button type="button" data-p="high"><span class="dot"></span>High</button>
        </div>
        <div class="due-field">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <label for="new-due" class="sr-only">Due date and time</label>
          <input type="datetime-local" id="new-due" />
          <button type="button" class="due-clear" id="new-due-clear" title="Clear due date">Clear</button>
        </div>
      </div>
    </form>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label for="search" class="sr-only">Search tasks</label>
        <input type="text" id="search" placeholder="Search tasks…" />
      </div>
      <button class="mobile-filter-toggle" id="mobile-filter-toggle" aria-expanded="false">Filters</button>
    </div>

    <div class="list-head">
      <h2 id="list-title">All tasks</h2>
      <span class="meta" id="list-meta">0 shown</span>
    </div>

    <ul class="tasks" id="task-list" aria-live="polite"></ul>

    <footer>Stored privately in this browser · nothing leaves your device</footer>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "focuslist.tasks.v2";
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  /** @type {{id:string, title:string, priority:'high'|'medium'|'low', completed:boolean, createdAt:number, dueAt:number|null}[]} */
  var tasks = [];
  var state = { status: "all", priority: "all", search: "", editingId: null };
  var newTaskPriority = "medium";

  function migrateOldData() {
    try {
      var oldRaw = localStorage.getItem("focuslist.tasks.v1");
      if (oldRaw && !localStorage.getItem(STORAGE_KEY)) {
        var old = JSON.parse(oldRaw);
        old.forEach(function (t) { t.dueAt = t.dueAt || null; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(old));
      }
    } catch (e) { /* ignore */ }
  }

  function load() {
    migrateOldData();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) tasks = JSON.parse(raw);
    } catch (e) { tasks = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) { /* storage unavailable */ }
  }

  var $ = function (sel) { return document.querySelector(sel); };
  var listEl = $("#task-list");
  var composer = $("#composer");
  var newTaskInput = $("#new-task");
  var newPriorityGroup = $("#new-priority");
  var newDueInput = $("#new-due");
  var newDueClear = $("#new-due-clear");
  var searchInput = $("#search");
  var statusFilters = $("#status-filters");
  var priorityFilters = $("#priority-filters");
  var clearCompletedBtn = $("#clear-completed");
  var sidebar = $("#sidebar");
  var mobileToggle = $("#mobile-filter-toggle");
  var todayLabel = $("#today-label");

  var iconCheck = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var iconEdit = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>';
  var iconTrash = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>';
  var iconSave = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var iconClock = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

  var PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

  function setTodayLabel() {
    var opts = { weekday: "long", month: "long", day: "numeric" };
    todayLabel.textContent = new Date().toLocaleDateString(undefined, opts);
  }

  function counts() {
    var total = tasks.length, completed = 0;
    for (var i = 0; i < tasks.length; i++) if (tasks[i].completed) completed++;
    return { total: total, completed: completed, pending: total - completed };
  }

  function visibleTasks() {
    var q = state.search.trim().toLowerCase();
    return tasks
      .filter(function (t) {
        if (state.status === "active" && t.completed) return false;
        if (state.status === "completed" && !t.completed) return false;
        if (state.priority !== "all" && t.priority !== state.priority) return false;
        if (q && t.title.toLowerCase().indexOf(q) === -1) return false;
        return true;
      })
      .sort(function (a, b) {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (a.priority !== b.priority) return PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
        var aDue = a.dueAt || Infinity, bDue = b.dueAt || Infinity;
        if (aDue !== bDue) return aDue - bDue;
        return b.createdAt - a.createdAt;
      });
  }

  function formatDue(ts) {
    var d = new Date(ts);
    var now = new Date();
    var sameYear = d.getFullYear() === now.getFullYear();
    var dateOpts = sameYear ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" };
    var dateStr = d.toLocaleDateString(undefined, dateOpts);
    var timeStr = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return dateStr + " · " + timeStr;
  }

  function toLocalInputValue(ts) {
    var d = new Date(ts);
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function render() {
    var c = counts();
    $("#stat-total").textContent = c.total;
    $("#stat-pending").textContent = c.pending;
    $("#stat-completed").textContent = c.completed;
    $("#progress-fill").style.width = (c.total ? Math.round((c.completed / c.total) * 100) : 0) + "%";

    $("#count-all").textContent = c.total;
    $("#count-active").textContent = c.pending;
    $("#count-completed").textContent = c.completed;

    var shown = visibleTasks();
    var titleMap = { all: "All tasks", active: "Active tasks", completed: "Completed tasks" };
    $("#list-title").textContent = titleMap[state.status];
    $("#list-meta").textContent = shown.length + (shown.length === 1 ? " shown" : " shown");

    listEl.innerHTML = "";

    if (shown.length === 0) {
      var li = document.createElement("li");
      li.className = "empty-state";
      var glyphText = tasks.length === 0 ? "A blank page" : "No matches";
      var bodyText = tasks.length === 0
        ? "Add your first task above to start the list."
        : "Nothing fits the current search and filters. Try clearing one.";
      li.innerHTML = '<div class="glyph">' + glyphText + '</div><p>' + bodyText + '</p>';
      listEl.appendChild(li);
      return;
    }

    shown.forEach(function (t) { listEl.appendChild(renderTask(t)); });
  }

  function renderTask(t) {
    var li = document.createElement("li");
    li.className = "task" + (t.completed ? " completed" : "");
    li.dataset.id = t.id;

    var flag = document.createElement("div");
    flag.className = "flagbar";
    flag.dataset.p = t.priority;
    li.appendChild(flag);

    var check = document.createElement("button");
    check.className = "check" + (t.completed ? " done" : "");
    check.type = "button";
    check.setAttribute("aria-label", t.completed ? "Mark as not completed" : "Mark as completed");
    check.innerHTML = iconCheck;
    check.addEventListener("click", function () { toggleComplete(t.id); });
    li.appendChild(check);

    var body = document.createElement("div");
    body.className = "task-body";

    if (state.editingId === t.id) {
      var panel = document.createElement("div");
      panel.className = "edit-panel";

      var input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.value = t.title;
      input.maxLength = 140;
      panel.appendChild(input);

      var dueRow = document.createElement("div");
      dueRow.className = "edit-due";
      var dueInput = document.createElement("input");
      dueInput.type = "datetime-local";
      if (t.dueAt) dueInput.value = toLocalInputValue(t.dueAt);
      dueRow.appendChild(dueInput);
      var dueClearBtn = document.createElement("button");
      dueClearBtn.type = "button";
      dueClearBtn.textContent = "Clear due";
      dueClearBtn.addEventListener("click", function () { dueInput.value = ""; });
      dueRow.appendChild(dueClearBtn);
      panel.appendChild(dueRow);

      body.appendChild(panel);
      setTimeout(function () { input.focus(); input.select(); }, 0);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commitEdit(t.id, input.value, dueInput.value);
        if (e.key === "Escape") { state.editingId = null; render(); }
      });
    } else {
      var title = document.createElement("div");
      title.className = "task-title";
      title.textContent = t.title;
      body.appendChild(title);

      var sub = document.createElement("div");
      sub.className = "task-sub";

      var pl = document.createElement("span");
      pl.className = "prio-label";
      pl.dataset.p = t.priority;
      pl.textContent = t.priority.charAt(0).toUpperCase() + t.priority.slice(1);
      sub.appendChild(pl);

      if (t.dueAt) {
        var overdue = !t.completed && t.dueAt < Date.now();
        var badge = document.createElement("span");
        badge.className = "due-badge" + (overdue ? " overdue" : "");
        badge.innerHTML = iconClock + " " + (overdue ? "Overdue · " : "") + formatDue(t.dueAt);
        sub.appendChild(badge);
      }

      body.appendChild(sub);
    }
    li.appendChild(body);

    var actions = document.createElement("div");
    actions.className = "task-actions";

    if (state.editingId === t.id) {
      var saveBtn = document.createElement("button");
      saveBtn.className = "icon-btn save";
      saveBtn.type = "button";
      saveBtn.setAttribute("aria-label", "Save task");
      saveBtn.innerHTML = iconSave;
      saveBtn.addEventListener("click", function () {
        var input = li.querySelector(".edit-input");
        var dueInput = li.querySelector(".edit-due input");
        commitEdit(t.id, input ? input.value : t.title, dueInput ? dueInput.value : "");
      });
      actions.appendChild(saveBtn);
    } else {
      var editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.type = "button";
      editBtn.setAttribute("aria-label", "Edit task");
      editBtn.innerHTML = iconEdit;
      editBtn.addEventListener("click", function () { state.editingId = t.id; render(); });
      actions.appendChild(editBtn);
    }

    var delBtn = document.createElement("button");
    delBtn.className = "icon-btn delete";
    delBtn.type = "button";
    delBtn.setAttribute("aria-label", "Delete task");
    delBtn.innerHTML = iconTrash;
    delBtn.addEventListener("click", function () { deleteTask(t.id); });
    actions.appendChild(delBtn);

    li.appendChild(actions);
    return li;
  }

  function addTask(title, priority, dueValue) {
    title = title.trim();
    if (!title) return;
    var dueAt = dueValue ? new Date(dueValue).getTime() : null;
    tasks.unshift({ id: uid(), title: title, priority: priority, completed: false, createdAt: Date.now(), dueAt: dueAt });
    save();
    render();
  }

  function toggleComplete(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.completed = !t.completed;
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (x) { return x.id !== id; });
    if (state.editingId === id) state.editingId = null;
    save();
    render();
  }

  function commitEdit(id, newTitle, newDueValue) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (t) {
      var trimmed = (newTitle || "").trim();
      if (trimmed) t.title = trimmed;
      t.dueAt = newDueValue ? new Date(newDueValue).getTime() : null;
    }
    state.editingId = null;
    save();
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    save();
    render();
  }

  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    addTask(newTaskInput.value, newTaskPriority, newDueInput.value);
    newTaskInput.value = "";
    newDueInput.value = "";
    newTaskInput.focus();
  });

  newPriorityGroup.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-p]");
    if (!btn) return;
    newTaskPriority = btn.dataset.p;
    Array.prototype.forEach.call(newPriorityGroup.querySelectorAll("button"), function (b) {
      b.classList.toggle("sel", b === btn);
    });
  });

  newDueClear.addEventListener("click", function () { newDueInput.value = ""; });

  searchInput.addEventListener("input", function () { state.search = searchInput.value; render(); });

  statusFilters.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-status]");
    if (!btn) return;
    state.status = btn.dataset.status;
    Array.prototype.forEach.call(statusFilters.querySelectorAll(".filter-btn"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  priorityFilters.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-p]");
    if (!btn) return;
    state.priority = btn.dataset.p;
    Array.prototype.forEach.call(priorityFilters.querySelectorAll(".flag-chip"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  clearCompletedBtn.addEventListener("click", function () {
    if (counts().completed === 0) return;
    clearCompleted();
  });

  mobileToggle.addEventListener("click", function () {
    var collapsed = sidebar.classList.toggle("collapsed");
    mobileToggle.setAttribute("aria-expanded", String(!collapsed));
  });

  if (window.matchMedia("(max-width: 860px)").matches) sidebar.classList.add("collapsed");

  setTodayLabel();
  load();
  render();
  setInterval(render, 60000); // keep "overdue" state fresh
})();
</script>
</body>
</html>
